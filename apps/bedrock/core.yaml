---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-bedrock
  namespace: minecraft-bedrock
  labels:
    role: service-config
    app: bds
data:
  EULA: "TRUE"
  GAMEMODE: "survival" # Options: survival, creative, adventure
  DIFFICULTY: "hard" # Options: peaceful, easy, normal, hard
  DEFAULT_PLAYER_PERMISSION_LEVEL: "member" # Options: visitor, member, operator
  LEVEL_NAME: "r.e.a.q.n.t.f.a.e."
  LEVEL_SEED: "479867fourtwo78"
  SERVER_NAME: "r.e.a.q.n.t.f.a.e."
  SERVER_PORT: "19132"
  #SERVER_PORT_V6: "19133"
  LEVEL_TYPE: "DEFAULT" # Options: FLAT, LEGACY, DEFAULT
  ALLOW_CHEATS: "true" # Options: true, false
  MAX_PLAYERS: "5"
  #PLAYER_IDLE_TIMEOUT: "30"
  #TEXTUREPACK_REQUIRED: "false" # Options: true, false
  #
  ## Changing these will have a security impact
  ONLINE_MODE: "true" # Options: true, false (removes Xbox Live account requirements)
  WHITE_LIST: "false" # If enabled, need to provide a whitelist.json by your own means.
  TRANSPORT: "nethernet" # Options: raknet (legacy UDP), nethernet (modern WebRTC - required by BDS 1.26+)
  SERVER_UDP_PORTS: "<public_ip>:19140-19150:19140-19150"
  #
  ## Changing these will have a performance impact
  VIEW_DISTANCE: "12"
  #TICK_DISTANCE: "4"
  #MAX_THREADS: "8"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: bds
  name: bds
  namespace: minecraft-bedrock
spec:
  # never more than 1 since BDS is not horizontally scalable
  replicas: 1
  serviceName: bds
  selector:
    matchLabels:
      app: bds
  template:
    metadata:
      labels:
        app: bds
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: yggdrasil
      initContainers:
        - name: fix-network-and-firewall
          image: nicolaka/netshoot
          command:
            - sh
            - -c
            - |
              ip route change default via 10.0.0.1 dev enp0s6 proto dhcp src 10.0.0.147 metric 100 mtu 1500 || true
              iptables -C ufw-user-input -p tcp --dport 19132 -j ACCEPT 2>/dev/null || iptables -I ufw-user-input -p tcp --dport 19132 -j ACCEPT
              iptables -C ufw-user-input -p udp --dport 19140:19150 -j ACCEPT 2>/dev/null || iptables -I ufw-user-input -p udp --dport 19140:19150 -j ACCEPT
          securityContext:
            privileged: true
      containers:
        - name: main
          image: itzg/minecraft-bedrock-server
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: minecraft-bedrock
          volumeMounts:
            - mountPath: /data
              name: data
          ports:
            - name: tcp-signaling
              containerPort: 19132
              protocol: TCP
            - name: udp-ping
              containerPort: 19132
              protocol: UDP
            - name: udp-19140
              containerPort: 19140
              protocol: UDP
            - name: udp-19141
              containerPort: 19141
              protocol: UDP
            - name: udp-19142
              containerPort: 19142
              protocol: UDP
            - name: udp-19143
              containerPort: 19143
              protocol: UDP
            - name: udp-19144
              containerPort: 19144
              protocol: UDP
            - name: udp-19145
              containerPort: 19145
              protocol: UDP
            - name: udp-19146
              containerPort: 19146
              protocol: UDP
            - name: udp-19147
              containerPort: 19147
              protocol: UDP
            - name: udp-19148
              containerPort: 19148
              protocol: UDP
            - name: udp-19149
              containerPort: 19149
              protocol: UDP
            - name: udp-19150
              containerPort: 19150
              protocol: UDP
          readinessProbe: &probe
            exec:
              command:
                - mc-monitor
                - status-bedrock
                - --host
                # force health check against IPv4 port
                - 127.0.0.1
                - --protocol
                - auto
            initialDelaySeconds: 30
          livenessProbe: *probe
          tty: true
          stdin: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bds
  namespace: minecraft-bedrock
spec:
  clusterIP: None
  selector:
    app: bds
  ports:
    - name: tcp-signaling
      port: 19132
      targetPort: 19132
      protocol: TCP
    - name: udp-ping
      port: 19132
      targetPort: 19132
      protocol: UDP
    - name: udp-19140
      port: 19140
      targetPort: 19140
      protocol: UDP
    - name: udp-19141
      port: 19141
      targetPort: 19141
      protocol: UDP
    - name: udp-19142
      port: 19142
      targetPort: 19142
      protocol: UDP
    - name: udp-19143
      port: 19143
      targetPort: 19143
      protocol: UDP
    - name: udp-19144
      port: 19144
      targetPort: 19144
      protocol: UDP
    - name: udp-19145
      port: 19145
      targetPort: 19145
      protocol: UDP
    - name: udp-19146
      port: 19146
      targetPort: 19146
      protocol: UDP
    - name: udp-19147
      port: 19147
      targetPort: 19147
      protocol: UDP
    - name: udp-19148
      port: 19148
      targetPort: 19148
      protocol: UDP
    - name: udp-19149
      port: 19149
      targetPort: 19149
      protocol: UDP
    - name: udp-19150
      port: 19150
      targetPort: 19150
      protocol: UDP
