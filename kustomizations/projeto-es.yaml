apiVersion: v1
kind: Namespace
metadata:
  name: projeto-es

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: projeto-es
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/projeto-es
  prune: true
  targetNamespace: projeto-es
  sourceRef:
    kind: GitRepository
    name: flux-system
