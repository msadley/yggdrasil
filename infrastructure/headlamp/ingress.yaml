kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging-cluster-issuer
spec:
  rules:
    - host: headlamp.ygg.dedyn.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port: 80
  tls:
    - hosts:
      - headlamp.ygg.dedyn.io
    secretName: headlamp-tls-secret
