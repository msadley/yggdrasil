apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-cluster-issuer
spec:
  acme:
    email: mendes.adley@gmail.com
    profile: classic
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-secret

    solvers:
      - http01:
          ingress:
            ingressClassName: "traefik"
