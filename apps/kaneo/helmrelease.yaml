apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaneo
  namespace: kaneo
spec:
  chartRef:
    kind: OCIRepository
    name: kaneo
    namespace: kaneo
  interval: 5m

  values:
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: kaneo.ygg.dedyn.io
          paths:
            - path: /
              pathType: Prefix
              service: kaneo
              port: 5173

    postgresql:
      auth:
        password: "your-secure-db-password"

    kaneo:
      env:
        authSecret: i-@81nc0#dbrgWz8ReAyg7Wd@q73Id!.
        clientUrl: kaneo.ygg.dedyn.io
