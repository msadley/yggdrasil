ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: "traefik"
    hosts:
      - host: syncthing.ygg.dedyn.io
        paths:
          - path: /
            pathType: prefix

persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    mountPath: /var/syncthing
    size: 5Gi
