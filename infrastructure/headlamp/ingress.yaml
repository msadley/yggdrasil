kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging-cluster-issuer
spec:
  rules:
    - http:
      paths:
        - path: headlamp.ygg.dedyn.io
          pathType: prefix
          backend:
            service:
              name: headlamp
              port: 80

  tls:
    domains:
      - main: headlamp.ygg.dedyn.io
    secretName: headlamp-tls-secret
