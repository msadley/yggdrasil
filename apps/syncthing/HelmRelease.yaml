apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: syncthing
      version: "5.1.2"
      sourceRef:
        kind: johanneskastl
        name: podinfo
        namespace: files
      interval: 10m

  values:
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: "traefik"
        hosts:
          - host: syncthing.ygg.dedyn.io
            paths:
              - path: /
                pathType: Prefix

    persistence:
      data:
        enabled: true
        accessMode: ReadWriteOnce
        mountPath: /var/syncthing
        size: 5Gi
