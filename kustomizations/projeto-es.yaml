apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: projeto-es
  namespace: flux-system
spec:
  interval: 5m
  url: ssh://git@github.com/Projeto-ES-2026-2-G1/main-repo.git
  ref:
    branch: main
  secretRef:
    name: projeto-es-flux
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-projeto-es
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: flux-system
  sourceRef:
    kind: GitRepository
    name: projeto-es
  path: "./k8s"
  prune: true
  timeout: 5m
