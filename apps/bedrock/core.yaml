---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-bedrock
  namespace: minecraft-bedrock
  labels:
    role: service-config
    app: bds
data:
  EULA: "TRUE"
  GAMEMODE: "survival" # Options: survival, creative, adventure
  DIFFICULTY: "hard" # Options: peaceful, easy, normal, hard
  DEFAULT_PLAYER_PERMISSION_LEVEL: "member" # Options: visitor, member, operator
  LEVEL_NAME: "r.e.a.q.n.t.f.a.e."
  LEVEL_SEED: "416665323"
  #SERVER_NAME: "my_minecraft_server"
  SERVER_PORT: "19132"
  #SERVER_PORT_V6: "19133"
  LEVEL_TYPE: "DEFAULT" # Options: FLAT, LEGACY, DEFAULT
  ALLOW_CHEATS: "false" # Options: true, false
  MAX_PLAYERS: "5"
  #PLAYER_IDLE_TIMEOUT: "30"
  #TEXTUREPACK_REQUIRED: "false" # Options: true, false
  #
  ## Changing these will have a security impact
  ONLINE_MODE: "true" # Options: true, false (removes Xbox Live account requirements)
  #WHITE_LIST: "false" # If enabled, need to provide a whitelist.json by your own means.
  #
  ## Changing these will have a performance impact
  #VIEW_DISTANCE: "10"
  #TICK_DISTANCE: "4"
  #MAX_THREADS: "8"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: bds
  name: bds
  namespace: minecraft-bedrock
spec:
  # never more than 1 since BDS is not horizontally scalable
  replicas: 1
  serviceName: bds
  selector:
    matchLabels:
      app: bds
  template:
    metadata:
      labels:
        app: bds
    spec:
      containers:
        - name: main
          image: itzg/minecraft-bedrock-server
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: minecraft-bedrock
          volumeMounts:
            - mountPath: /data
              name: data
          ports:
            - containerPort: 19132
              protocol: UDP
            - containerPort: 19133
              protocol: UDP
          readinessProbe: &probe
            exec:
              command:
                - mc-monitor
                - status-bedrock
                - --host
                # force health check against IPv4 port
                - 127.0.0.1
            initialDelaySeconds: 30
          livenessProbe: *probe
          tty: true
          stdin: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bds
  namespace: minecraft-bedrock
spec:
  selector:
    app: bds
  ports:
    - port: 19132
      protocol: UDP
      nodePort: 30132
      name: default
  type: LoadBalancer
