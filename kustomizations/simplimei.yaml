apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: simplimei
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/simplimei
  prune: true
  targetNamespace: simplimei
  dependsOn:
    - name: cert-manager
    - name: sealed-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
