kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging-cluster-issuer
spec:
  rules:
    - host: headlamp.ygg.dedyn.io
      http:
      paths:
        - path: /
          pathType: prefix
          backend:
            service:
              name: headlamp
              port: 80
  tls:
    secretName: headlamp-tls-secret
    - hosts:
      - headlamp.ygg.dedyn.io
